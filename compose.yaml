services:
  cass:
    build:
      context: .
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      CASS_BIND_ADDR: ":8080"
      CASS_AUTH_TOKEN: "${CASS_AUTH_TOKEN:?set CASS_AUTH_TOKEN}"
      CASS_ALLOWED_ROOTS: "/workspace,/tmp,/var/log/cass"
      CASS_PROC_ROOT: "/proc"
      CASS_ENABLED_OPERATIONS: "capabilities.describe,host.info,filesystem.list,filesystem.stat,filesystem.read,filesystem.tail"
      CASS_HOST_INFO_FIELDS: "hostname,os,arch,cpus,uptime_seconds,kernel_version"
      CASS_MAX_REQUEST_BYTES: "65536"
      CASS_MAX_READ_BYTES: "65536"
      CASS_MAX_TAIL_BYTES: "65536"
      CASS_MAX_LIST_ENTRIES: "256"
      CASS_MAX_PROCESS_ENTRIES: "256"
      CASS_AUDIT_PATH: "/runtime/audit.log"
      CASS_READ_HEADER_TIMEOUT: "5s"
      CASS_READ_TIMEOUT: "15s"
      CASS_WRITE_TIMEOUT: "30s"
      CASS_IDLE_TIMEOUT: "60s"
    volumes:
      - ./testdata/workspace:/workspace:ro
      - ./testdata/varlog:/var/log/cass:ro
      - ./runtime:/runtime
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
