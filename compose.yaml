services:
  cass:
    build:
      context: .
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      SROIAAA_BIND_ADDR: ":8080"
      SROIAAA_AUTH_TOKEN: "${SROIAAA_AUTH_TOKEN:?set SROIAAA_AUTH_TOKEN}"
      SROIAAA_ALLOWED_ROOTS: "/workspace,/tmp,/var/log/cass"
      SROIAAA_PROC_ROOT: "/proc"
      SROIAAA_ENABLED_OPERATIONS: "capabilities.describe,host.info,filesystem.list,filesystem.stat,filesystem.read,filesystem.tail"
      SROIAAA_HOST_INFO_FIELDS: "hostname,os,arch,cpus,uptime_seconds,kernel_version"
      SROIAAA_MAX_REQUEST_BYTES: "65536"
      SROIAAA_MAX_READ_BYTES: "65536"
      SROIAAA_MAX_TAIL_BYTES: "65536"
      SROIAAA_MAX_LIST_ENTRIES: "256"
      SROIAAA_MAX_PROCESS_ENTRIES: "256"
      SROIAAA_AUDIT_PATH: "/runtime/audit.log"
      SROIAAA_READ_HEADER_TIMEOUT: "5s"
      SROIAAA_READ_TIMEOUT: "15s"
      SROIAAA_WRITE_TIMEOUT: "30s"
      SROIAAA_IDLE_TIMEOUT: "60s"
    volumes:
      - ./testdata/workspace:/workspace:ro
      - ./testdata/varlog:/var/log/cass:ro
      - ./runtime:/runtime
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
