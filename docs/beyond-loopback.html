<header class="masthead">
  <p class="eyebrow">Cassandra · decision memo</p>
  <h1>Beyond Loopback</h1>
  <p class="standfirst">The endpoint agent reached a second host. It got there by a route this memo did not list, and wiring it turned up five defects, none of them in the thing being wired.</p>
  <div class="byline">
    <span><b>Status</b> two hosts, answering</span>
    <span><b>Route taken</b> SSH forward, not A or B</span>
    <span><b>For review</b> Codex, Gemini</span>
    <span><b>Rev 3</b> 2026-09-17</span>
  </div>
</header>

<section>
  <h2>Where it stands</h2>
  <p class="deck">Measured, not estimated</p>
  <p><code>cassd</code> runs on sgtstubby and winston as a systemd service and answers <code>live.evidence</code> — the intent the README promised since Phase One with nothing behind it. It reports host facts, lists and stats paths under two roots, and tails one named file. It does nothing else, and it writes nothing anywhere.</p>

  <dl class="verdict">
    <div><dt>Hosts</dt><dd>2 <small>sgtstubby, winston</small></dd></div>
    <div><dt>Exposure</dt><dd>1.1 <small>systemd-analyze, “OK”, both</small></dd></div>
    <div><dt>Operations</dt><dd>5 <small>+ host.info, tail</small></dd></div>
    <div><dt>Anonymous</dt><dd>401 <small>fails closed</small></dd></div>
  </dl>

  <p>The filesystem is read-only in the service's own mount namespace via <code>ProtectSystem=strict</code>, and <code>@mount</code> is denied outright — so the daemon cannot mount anything even if a later change tries to. That is a stronger statement than mounting things read-only itself, and it does not depend on the code continuing to have no write path, which it currently does not outside its audit log.</p>

  <p>What it can reach is bounded by ordinary Unix permissions rather than by policy alone. <code>/var/log</code> is <code>0755</code>, so the directory lists; <code>/var/log/messages</code> and <code>/var/log/secure</code> are <code>0600 root:root</code>, so they do not open. Reading those would be a deliberate grant — a <code>SupplementaryGroups=</code> line — and it should be argued on its own rather than inherited from a deployment.</p>
</section>

<section>
  <h2>What happened, 2026-09-17</h2>
  <p class="deck">The fork was resolved by a third path</p>

  <p>Neither Route A nor Route B was built. The agent reached its second host over an <strong>SSH forward</strong>: <code>cassd</code> on winston binds its own loopback, and the broker connects to <code>127.0.0.1:8101</code> on sgtstubby. The connector's <code>https</code>-unless-loopback rule is satisfied literally, and the transport is encrypted and the far host authenticated — by SSH, rather than by a certificate authority nobody has stood up.</p>

  <div class="note">
    <span class="lede">Why it won on the day</span>
    <p><strong>No new code.</strong> Both memo routes are net-new implementation; this one required none. <strong>SSH host-key verification</strong> is real authentication of the far host and is already operated here. <strong>The key can be bounded harder than the credential it carries</strong> — <code>restrict,port-forwarding,command="/bin/false",permitopen="127.0.0.1:8099"</code> yields a key that can open one port on one host and do nothing else, not even log in.</p>
    <p>It forecloses nothing. When a CA exists, endpoints change and the forwards go.</p>
  </div>

  <p>What is answerable now, that no other connector covers: the kernel and uptime of each host, when each was last patched and with what, and therefore which hosts are drifting. The first real finding arrived immediately — sgtstubby runs <code>5.14.0-687.26.1</code> against winston's <code>687.31.1</code>.</p>

  <h3>Wrong answers, made loud</h3>
  <p>The port map now lives in two places: the tunnel unit and <code>CASS_AGENT_CONFIG</code>. Transpose them and one host's filesystem returns under another host's name — an answer that parses, reads sensibly, and is false throughout.</p>
  <p>So the agent reports its hostname in the metadata of <em>every</em> response, and the connector refuses a reply from anywhere but the host the plan named. Verified by doing it deliberately: pointing sgtstubby's entry at winston's forward produces <em>“the endpoint for that host is incorrectly pointing to a host reporting as winston”</em> rather than an answer. A check that only ran at startup would not have survived a forward being repointed afterwards, which is exactly when this goes wrong.</p>
</section>

<section>
  <h2>Five defects, none in the feature</h2>
  <p class="deck">What wiring one operation exposed</p>

  <div class="tablewrap">
    <table>
      <caption>Each was found by using the system, not by reading it.</caption>
      <thead><tr><th>Defect</th><th>How it presented</th></tr></thead>
      <tbody>
        <tr><td><code>host.info</code> was unroutable</td><td>Path validated before operation, so “no path” failed as <em>“path must be absolute”</em></td></tr>
        <tr><td>A later refusal destroyed earlier evidence</td><td>A successful call discarded because a speculative follow-up was denied</td></tr>
        <tr><td>An oversized result left no trace entry</td><td><code>intent_proposed → policy_allowed → nothing</code></td></tr>
        <tr><td>The tool description refused a granted capability</td><td>Prose beside a generated enum; the model never consulted the enum</td></tr>
        <tr><td><code>ProcSubset=pid</code> removed two of six fields</td><td><code>/proc/uptime</code> and <code>/proc/version</code> unreadable; unreadable fields are skipped silently</td></tr>
      </tbody>
    </table>
  </div>

  <p><strong>Four of the five are one shape.</strong> Something was missing and the system reported it as something that did not exist. A discarded result looked like no result; a blocked <code>/proc</code> read looked like an unsupported field; a stale description looked like an unsupported capability. Each failed closed — correct for safety, and close to useless for diagnosis, because a capability that is absent and a capability that is broken produce the same sentence.</p>

  <p>The refusal case is the one with a real trade in it. A refusal ends the loop when it is all that happened, because somebody who asks for something forbidden should be told so. Once evidence has been collected, the same refusal became a correctable mistake — the broker still refused the call, and the only change is whether that refusal also destroys unrelated work already authorized and already done.</p>
</section>

<section>
  <h2>What the score does and does not say</h2>
  <p class="deck">Calibration before anyone reads 1.1 as a safety claim</p>
  <p><code>systemd-analyze security</code> walks a fixed checklist of roughly seventy-five directives, weights each, and normalises to 0–10. Roughly: under 1.0 is <em>OK</em>, under 5.0 <em>MEDIUM</em>, above 9.0 <em>DANGEROUS</em>. A unit with no hardening at all scores about 9.6; most distribution daemons land between 6 and 9.</p>

  <p>It reads the unit file and nothing else. It knows nothing about the program. A daemon that shells out to <code>sh -c $input</code> with a 0.1 score is owned on the first request. Conversely, almost everything actually protecting <code>cassd</code> is invisible to it: the code has no write path, allowed roots are canonicalised through <code>EvalSymlinks</code> so a symlink cannot walk out, every request is authorised by the broker against policy before it is issued, and responses are capped at 128 KiB with a 20-second timeout. None of that scores a point.</p>

  <p>Read 1.1 as <em>this unit declares nearly every restriction available</em>, not as <em>this service is safe</em>.</p>

  <div class="tablewrap">
    <table>
      <caption>Remaining findings. The displayed total is normalised, not a sum — these weights are relative.</caption>
      <thead><tr><th>Directive</th><th>Why it stands</th><th class="num">Wt</th></tr></thead>
      <tbody>
        <tr><td class="mono">PrivateNetwork</td><td>It is an HTTP server the broker connects to</td><td class="num">0.5</td></tr>
        <tr><td class="mono">AF_INET</td><td>Same — it needs a TCP socket</td><td class="num">0.3</td></tr>
        <tr><td class="mono">PrivateUsers</td><td>Untested against DynamicUser; may be free</td><td class="num">0.2</td></tr>
        <tr><td class="mono">RootDirectory</td><td>A chroot would hide <code>/var/log</code>, the point</td><td class="num">0.1</td></tr>
        <tr><td class="mono">DeviceAllow</td><td>Costs <code>/dev/urandom</code> to remove</td><td class="num">0.1</td></tr>
        <tr><td class="mono">IPAddressDeny</td><td>Already localhost-only; any allow-list scores &gt; 0</td><td class="num">0.1</td></tr>
      </tbody>
    </table>
  </div>

  <div class="note">
    <span class="lede">One finding worth recording</span>
    <p><code>DevicePolicy=closed</code> with an empty <code>DeviceAllow=</code> was added to clear the <code>char-rtc:r</code> point. It cleared nothing: <code>closed</code> is itself what grants the standard device set, so emptying the extra allows leaves the defaults where they were. Removing rtc needs <code>DevicePolicy=strict</code> with an explicit list, and <code>strict</code> with an empty list denies <code>/dev/urandom</code>, stopping the Go runtime before <code>main()</code>.</p>
    <p>Both lines were deleted rather than left in. A directive that implies a protection it does not provide is worse than no directive — the next reader takes it as settled.</p>
  </div>
</section>

<section>
  <h2>The fork</h2>
  <p class="deck">0.8 of the remaining 1.1 is transport</p>
  <p><code>PrivateNetwork</code> and <code>AF_INET</code> together are most of what is left, and both exist only because the agent speaks TCP. They point in opposite directions depending on where the next agent runs, which is why this is a decision rather than a backlog item.</p>

  <div class="routes">
    <div class="route">
      <span class="tag">Route A</span>
      <h3>Unix socket, local only</h3>
      <p>The agent listens on a socket file instead of a port. The broker connects through the filesystem.</p>
      <ul>
        <li><code>PrivateNetwork=yes</code> becomes possible — the service gets no network at all</li>
        <li><code>RestrictAddressFamilies=AF_UNIX</code> only</li>
        <li>Access control becomes socket ownership and mode, which the kernel enforces</li>
        <li>The bearer token becomes belt-and-braces rather than the only lock</li>
      </ul>
      <p class="cost">Clears ~0.8. Cannot reach a second host by definition.</p>
    </div>
    <div class="route remote">
      <span class="tag">Route B</span>
      <h3>TLS, and then mTLS</h3>
      <p>The agent keeps a TCP port and presents a certificate. The broker verifies it, and eventually presents one of its own.</p>
      <ul>
        <li>Already enforced in code: the connector refuses any non-loopback endpoint that is not <code>https</code></li>
        <li>Needs an internal CA — public issuance will not reach these hosts</li>
        <li><code>IPAddressAllow</code> narrows from localhost to the broker's address</li>
        <li>mTLS turns “whoever holds the string” into “whoever holds the key”; revocation is then <em>possible</em>, but needs CRL/OCSP or short-lived certificates and per-agent authorisation to be real</li>
      </ul>
      <p class="cost">Clears none of the 0.8. Reaches every host.</p>
    </div>
  </div>

  <h3>Route A's ownership model is a unit directive, not new design</h3>
  <p>The obvious objection to Route A is that a socket needs an access model, and inventing one is exactly the kind of security design that goes wrong quietly. It does not have to be invented. <code>systemd</code> socket activation already owns this problem: a <code>.socket</code> unit creates the socket with an owner, a group and a mode, and hands the listening descriptor to a service that never opens a network socket itself.</p>

<pre><code># cassd.socket
[Socket]
ListenStream=/run/cassd/cassd.sock
SocketUser=glenamac      # the broker's identity
SocketMode=0600          # nobody else can even connect
</code></pre>

  <p>Two consequences worth separating. The access decision moves from a string the caller presents to a permission the kernel checks before a byte is read — which is the one thing a bearer token structurally cannot do, and which matters more given that a token authorises everything under the roots rather than just the policy's aliases. And the service can then run with <code>PrivateNetwork=yes</code> and <code>RestrictAddressFamilies=AF_UNIX</code>, because it no longer needs a network stack at all.</p>

  <p>The Go side is not free but it is small: take the listener from the inherited descriptor rather than calling <code>ListenAndServe</code> on an address. That is a handful of lines around <code>net.FileListener</code>, plus the unit. Calling it “net-new implementation” is fair; calling it a new security design is not, and the distinction is most of the cost estimate.</p>

  <p>They are not exclusive. The agent could support both, and the local deployment would take Route A while remote ones take Route B. That is also a decision, and not a free one: two transports is two code paths, two failure modes, and two things to get right in the connector's endpoint validation.</p>

  <div class="corrected">
    <span class="lede">Neither was built — a third route was</span>
    <p><code>cassd</code> still serves over TCP and nothing else: no Unix-socket listener, no TLS listener, no certificate configuration. Both routes above remain net-new implementation.</p>
    <p>An SSH forward reached the second host without either. It is not a substitute for Route B at scale — every host needs a forward, a restricted key and a port, and the port map can drift — but it answered the question that mattered first: <em>is per-host filesystem evidence worth building a CA for?</em> That is now answerable from data rather than argument.</p>
  </div>

  <h3>Route C, in practice</h3>
  <p>What it costs, having done it: one <code>.socket</code>-free user unit per host, one restricted key, one local port, and a hostname cross-check to make a transposed port loud. What it does not cost: a certificate authority, a TLS listener in the agent, or any change to the connector.</p>
  <p>It also exposed an option the memo had not considered. The tunnel could not run as a system unit at all — SELinux denies <code>init_t</code> the right to execute <code>ssh_exec_t</code>, reported as <code>203/EXEC</code>, which reads as a missing binary. A user service runs in the calling user's domain and sidesteps it, and happens to run as the user who owns the key, which is where it belonged.</p>
</section>

<section>
  <h2>What remote actually changes</h2>
  <p class="deck">The threat model, not just the plumbing</p>

  <h3>The token becomes a network credential — and it outranks the policy</h3>
  <p>Today it never leaves the kernel. Remotely it is at rest on both ends and in flight between them. <code>CASS_AUTH_TOKENS</code> already accepts a comma-separated list specifically so a token can be rotated without a flag day — that facility matters locally in theory and remotely in practice.</p>
  <p>More important than where it travels is what it authorises. The agent's request envelope carries an operation and a raw target path. It has no notion of the broker's resource aliases: the <code>log-dir → /var/log</code> mapping exists only broker-side. So the policy bounds <strong>what Cassandra issues</strong>, not <strong>what the token can ask for</strong>. Anyone holding it can call the agent directly for any enabled operation on any path beneath <code>CASS_ALLOWED_ROOTS</code>.</p>
  <p>That makes the roots, not the policy, the real boundary for a token holder — and it makes keeping them narrow load-bearing rather than tidy. It is also an argument in Route A's favour that has nothing to do with the exposure score: a socket with an ownership model bounds <em>who can call at all</em>, which a bearer token never does.</p>

  <h3>The broker becomes the concentrated target</h3>
  <p>It holds every host's endpoint and every host's token. Per-host tokens mean one compromised agent does not yield the others; they do nothing about the machine holding all of them. Compromising the broker is strictly worse than compromising any single agent, because each agent's hardening bounds only that host.</p>

  <h3>Hardening changes role, not value</h3>
  <p>The <code>DynamicUser</code> and read-only work does not protect the network path and never did. What it does is bound the consequence: a compromised agent is a read-only window onto world-readable files, not a foothold. That argument gets <em>more</em> important as the number of agents grows, not less.</p>

  <h3>Availability becomes a dependency with a loop in it</h3>
  <p>An agent that is <em>configured</em> is offered to the model whether or not it is <em>running</em>. Intents are derived from the connectors the executor can reach, not from their health, so a stopped agent is not a quiet absence — it is an execution failure returned to the model as a correctable tool error, which spends one of its five turns. The system that would ordinarily notice a service being down is this one. That recursion is worth naming before it is discovered.</p>

  <div class="corrected">
    <span class="lede">Corrected in rev 2</span>
    <p>Rev 1 said a down agent causes the intent to be withheld from the model. That is wrong. Withholding happens only when the connector is absent or unconfigured — <code>NewSession</code> builds the intent list from <code>executor.Sources()</code>, which reports connectors that exist, not connectors that answer.</p>
    <p>The practical difference matters: a down agent costs turns and produces a visible failure, rather than silently shrinking what Cassandra claims it can do.</p>
  </div>
</section>

<section>
  <h2>For the reviewers</h2>
  <p class="deck">Where disagreement would be most useful</p>
  <p>Rev 1 drew five findings, all of which held up against the code. Four are corrected above and one — a README still asserting no agent was deployed — is fixed in the repository. The questions below are unchanged except where those corrections bear on them.</p>
  <ol class="questions">
    <li>
      <p class="q">Does Route C scale, or is it a two-host answer?</p>
      <p class="why">It works and it cost no code. But each host adds a forward, a key, a port and a second place for that port to be recorded. At what host count does the bookkeeping exceed the cost of a CA? The cross-check makes drift loud rather than silent, which raises that number — it does not remove it.</p>
    </li>
    <li>
      <p class="q">Is a dual transport worth two code paths?</p>
      <p class="why">Unchanged, and now less urgent. Route A is strictly better where it applies and useless where it does not; socket activation makes it cheaper than it first appears. Route C occupies the ground that was forcing the question.</p>
    </li>
    <li>
      <p class="q">Does mTLS belong in the first remote deployment or the second?</p>
      <p class="why">Bearer-over-TLS is materially safer than today and ships sooner. Adding client certificates later means revisiting every host. Doing it first delays the first remote agent behind a CA decision.</p>
    </li>
    <li>
      <p class="q">Should the broker hold every token, or should agents authenticate the broker?</p>
      <p class="why">The current direction is one-way: agents trust whoever presents the right string. Reversing or doubling that changes where a compromise concentrates.</p>
    </li>
    <li>
      <p class="q">Is <code>PrivateUsers=yes</code> free here?</p>
      <p class="why">Worth 0.2 and untested. The service reads only world-readable files, so it may cost nothing — but it interacts with <code>DynamicUser</code>, and the claim should be measured rather than asserted.</p>
    </li>
    <li>
      <p class="q">What is the monitoring story for the monitor?</p>
      <p class="why">A stopped agent spends a turn and returns an error on every question that routes to it, and there are now two agents and a tunnel between them. The forward self-heals within ten seconds — tested by killing it — but nothing notices if it stops healing. The morning digest and its watchdog are the obvious hook and neither knows agents exist.</p>
    </li>
  </ol>
</section>

<section>
  <h2>One habit worth reviewing</h2>
  <p class="deck">Not a defect, and probably the most transferable thing here</p>
  <p>Three things were sized today by reasoning rather than measurement, and all three were wrong in the direction that looks fine until it is used. A hardening change predicted to clear 0.4 of exposure cleared 0.1. A tail sized at 49152 bytes produced a 101151-byte response against a 65536-byte cap and was discarded whole. A forward-only SSH key was declared working on the evidence that a local listener had appeared, which happens whether the forward is permitted or forbidden.</p>
  <p>Each was one command away from being checked. The corresponding question for a reviewer is not about this system: <strong>which of your own checks measure a proxy for the property rather than the property?</strong> A listener is not a channel, an exit code is not an answer, and a unit file that parses is not a service that runs.</p>
</section>
